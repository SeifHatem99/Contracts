<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Same Day Home Solutions</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">SD</div>
        <div>
          <h1 id="companyNameDisplay">Same Day Home Solutions</h1>
          <p>Contract Management System</p>
        </div>
      </div>
      <nav class="nav" id="mainNav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="contract">Create Contract</button>
        <button class="nav-item" data-view="deal">Deal Details</button>
        <button class="nav-item" data-view="contacts">Contacts</button>
        <button class="nav-item" data-view="properties">Properties</button>
        <button class="nav-item" data-view="templates">Template Manager</button>
        <button class="nav-item" data-view="data">Data</button>
        <button class="nav-item" data-view="emails">Email Center</button>
        <button class="nav-item" data-view="notifications">Notifications</button>
        <button class="nav-item" data-view="files">File Center</button>
        <button class="nav-item" data-view="reports">Reports</button>
        <button class="nav-item" data-view="diagnostics">Diagnostics</button>
        <button class="nav-item" data-view="sync">Sync</button>
        <button class="nav-item" data-view="search">Search</button>
        <button class="nav-item" data-view="settings">Settings</button>
      </nav>
      <div class="sidebar-footer">
        <div class="shortcut">Ctrl/Cmd + K search</div>
        <div class="shortcut">Ctrl/Cmd + S save draft</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="viewTitle">Dashboard</h2>
          <p id="viewSubtitle">Manage deals, templates, and contract generation from one place.</p>
          <div class="muted" id="breadcrumbs">Dashboard</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-secondary" id="quickNewDeal">New Deal</button>
          <button class="btn btn-primary" id="openContractBuilder">Create Contract</button>
        </div>
      </header>

      <section id="notifications" class="notifications"></section>

      <section id="viewContainer" class="view-container"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
